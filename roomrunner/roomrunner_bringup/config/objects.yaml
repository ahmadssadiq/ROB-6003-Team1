# Tagged objects the overhead camera reports (decisions.md 12). Tag id -> name used in requests, and kind.
# height: height of the tag above the floor (m), so the overhead camera can place raised tags correctly
# (overhead_camera.py). PLACEHOLDER heights: measure the printed objects and the robot, then update.
tags:
  10: {name: red_block,   kind: block, height: 0.05}     # PLACEHOLDER
  11: {name: blue_block,  kind: block, height: 0.05}     # PLACEHOLDER
  12: {name: green_block, kind: block, height: 0.05}     # PLACEHOLDER
  20: {name: tray,        kind: tray,  height: 0.02}     # PLACEHOLDER
robot_tag: 40                    # tag on top of the robot: checks T_map_aruco, ground truth for E1
robot_tag_height: 0.30           # PLACEHOLDER: floor to the robot-top tag (m)
robot_clear_radius: 0.30         # PLACEHOLDER: radius (m) around the robot tag cleared from the obstacle grid,
                                 # since the robot is not in the empty-floor picture; a bit more than the base
