# Pick and place settings for the Assignment 03 EEControl node (base frame, metres; gripper in %).
# PLACEHOLDERS: measure them with the real arm and blocks (owner: Sarvanagupta).
grasp_z: -0.010        # fingertip height when grasping a block (base frame z; the floor is about -0.03)
place_z: 0.020         # fingertip height when releasing on the tray
hover_height: 0.050    # above grasp/place height before descending
lift_height: 0.060     # above grasp height after grasping
gripper_open: 40.0     # % sent on /arm_commands
gripper_closed: 0.0
shoulder: [0.06715, 0.0]   # shoulder pan axis in the base frame (Assignment 03 arm model)
min_reach: 0.12
max_reach: 0.30
grasp_offset: [0.0, 0.0]   # PLACEHOLDER (radial, sideways) m: fingertip target shift so the block ends up
                           # between the jaws (grasp.with_grasp_offset); measure with try_pick
settle_time: 4.0       # s at most to wait for the arm to reach each target (it goes on earlier once there)
joint_tolerance: 3.0   # deg: the arm counts as there when all 5 joints are this close to the command
ik_reply_timeout: 1.0  # s: no /arm_commands from the IK node by then means it refused the target
gripper_settle: 0.5    # s for the jaws after a gripper change
holding_min_gripper: 5.0   # PLACEHOLDER %: after closing on a block the gripper reads at least this much more
                           # than gripper_closed; closed all the way means the block was missed
tray_slots:            # PLACEHOLDER: drop spots in the tray's own frame (m, x along the tray tag's x axis)
  - [-0.04, -0.04]
  - [0.04, -0.04]
  - [-0.04, 0.04]
  - [0.04, 0.04]
slot_clearance: 0.04   # m: a slot is taken when another object is closer than this
